aid: china-southern-air-logistics
name: China Southern Air Logistics
description: 'China Southern Air Logistics Co., Ltd. (南航物流, CSAL) is the air cargo and
  logistics arm of China Southern Airlines, established in December 2018 and headquartered
  in Guangzhou. It combines the airline''s freighter fleet with passenger belly capacity
  into an integrated air logistics network, and sells express (CZ Speed), standard, special
  cargo, whole-aircraft charter, intermodal truck and door-to-door products through its
  Tang (唐翼) online cargo system at cargo.csair.com, where agents and shippers book capacity,
  query freight rates, track air waybills, manage dangerous-goods accounts and request
  invoices. As of this profile the company publishes no developer program, no public API
  reference and no machine-readable specification; system-to-system integration is arranged
  bilaterally with agents and forwarders.'
