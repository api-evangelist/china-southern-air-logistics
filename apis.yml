  reason: no-developer-program
  detail: >-
    The Tang (唐翼) cargo portal at cargo.csair.com is the company's only system surface and
    it 302-redirects every unknown path back to /pages/home, so nothing under /.well-known/,
    /openapi.json or /api-docs exists; the one developer-shaped host linked from its own
    homepage, cargodev.csair.com, does not resolve in public DNS, and there is no developer
    portal, API reference or SDK page anywhere on cargo.csair.com, tang.csair.com or
    csairgroup.cn.
